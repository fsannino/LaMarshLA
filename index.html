<style>
:root {
--navy: #2B3D4F;
--navy-light: #3A4F63;
--gold: #A20934;
--gold-light: #C41E4A;
--wine-text: #E85D7F;
--cream: #F6F3F1;
--cream-dark: #ECE7E3;
--white: #ffffff;
--text-dark: #1a1a2e;
--text-medium: #4a4a5a;
--text-light: #7a7a8a;
--accent-teal: #2A7B88;
--font-display: 'Cormorant Garamond', Georgia, serif;
--font-body: 'DM Sans', 'Segoe UI', sans-serif;
--max-width: 1200px;
--transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);color:var(--text-dark);background:var(--cream);overflow-x:hidden;line-height:1.7}
/* ===== LANGUAGE BAR ===== */
.lang-bar{
position:fixed;top:0;left:0;right:0;z-index:10001;
background:var(--gold);
height:36px;display:flex;align-items:center;justify-content:flex-end;
padding:0 2rem;
border-bottom:1px solid rgba(162,9,52,0.1);
}
.lang-bar .lang-options{display:flex;gap:0.2rem;align-items:center}
.lang-bar .lang-btn{
background:none;border:1px solid transparent;color:rgba(255,255,255,0.5);
font-size:0.72rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
padding:4px 10px;border-radius:4px;cursor:pointer;transition:var(--transition);
font-family:var(--font-body);
}
.lang-bar .lang-btn:hover{color:rgba(255,255,255,0.8)}
.lang-bar .lang-btn.active{color:var(--gold);border-color:#FFFFFF;background:#FFFFFF;font-weight:700}
.lang-bar .lang-sep{color:rgba(255,255,255,0.15);font-size:0.7rem;margin:0 2px}
.lang-bar .lang-label{color:rgba(255,255,255,0.3);font-size:0.68rem;margin-right:0.5rem;letter-spacing:0.05em}
/* ===== HEADER ===== */
.header{position:fixed;top:36px;left:0;right:0;z-index:9999;background:#FFFFFF;border-bottom:1px solid rgba(43,61,79,0.08);transition:box-shadow 0.3s;box-shadow:0 1px 10px rgba(43,61,79,0.06)}
.header.scrolled{box-shadow:0 4px 30px rgba(11,29,58,0.3)}
.nav-container{max-width:var(--max-width);margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:66px}
.logo{display:flex;align-items:center;gap:0.5rem;text-decoration:none;cursor:pointer}
.logo-text{font-family:var(--font-display);font-size:1.5rem;font-weight:700;color:var(--navy)}
.logo-text span{color:var(--gold)}
.logo-badge{background:var(--gold);color:#FFFFFF;font-size:0.5rem;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:0.1em;text-transform:uppercase}
.nav-links{display:flex;gap:0.15rem;list-style:none}
.nav-links li{list-style:none}
.nav-links a{color:var(--navy);text-decoration:none;font-size:0.82rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:0.5rem 0.9rem;border-radius:6px;transition:var(--transition)}
.nav-links a:hover,.nav-links a.active{color:var(--gold);background:rgba(162,9,52,0.06)}
.hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;width:42px;height:42px;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;cursor:pointer;gap:5px;padding:0;z-index:10001}
.hamburger .bar{display:block;width:20px;height:2px;background:var(--navy);border-radius:2px;transition:all 0.3s ease}
.hamburger.open .bar:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open .bar:nth-child(2){opacity:0}
.hamburger.open .bar:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998}
.mobile-overlay.show{display:block}
.mobile-menu{position:fixed;top:0;right:-300px;width:280px;height:100vh;background:#FFFFFF;z-index:10000;transition:right 0.35s cubic-bezier(0.4,0,0.2,1);padding:110px 1.5rem 2rem;overflow-y:auto;border-left:1px solid rgba(162,9,52,0.15)}
.mobile-menu.open{right:0}
.mobile-menu a{display:block;color:var(--navy);text-decoration:none;font-size:1rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;padding:1rem 0.8rem;border-bottom:1px solid rgba(43,61,79,0.08);transition:var(--transition);cursor:pointer}
.mobile-menu a:hover,.mobile-menu a.active{color:var(--gold);background:rgba(162,9,52,0.08);padding-left:1.2rem}
@media(max-width:960px){.nav-links{display:none!important}.hamburger{display:flex!important}}
/* ===== HERO ===== */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;background:linear-gradient(160deg,#FFFFFF 0%,var(--cream) 55%,#EDE6E1 100%);padding-top:102px}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse 60% 50% at 70% 40%,rgba(162,9,52,0.08) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 20% 80%,rgba(42,123,136,0.06) 0%,transparent 50%)}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:150px;background:linear-gradient(to top,var(--cream),transparent)}
.hero-content{max-width:var(--max-width);margin:0 auto;padding:3rem 2rem 6rem;position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.hero-left h1{font-family:var(--font-display);font-size:3.6rem;font-weight:600;color:var(--navy);line-height:1.1;margin-bottom:0.5rem}
.hero-left h1 .accent{color:var(--gold);display:block;font-style:italic}
.hero-tagline{font-size:1.2rem;color:var(--text-medium);font-weight:300;margin-bottom:2rem;line-height:1.6}
.hero-cta{display:inline-flex;align-items:center;gap:0.7rem;background:var(--gold);color:#FFFFFF;text-decoration:none;padding:0.9rem 2rem;border-radius:8px;font-weight:600;font-size:0.9rem;transition:var(--transition);cursor:pointer}
.hero-cta:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 30px rgba(162,9,52,0.3)}
.hero-right{display:flex;justify-content:center}
.hero-visual{width:360px;height:360px;border-radius:50%;background:linear-gradient(135deg,rgba(162,9,52,0.15),rgba(43,61,79,0.06));border:1px solid rgba(162,9,52,0.2);display:flex;align-items:center;justify-content:center;position:relative}
.hero-visual::before{content:'';position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(162,9,52,0.08)}
.hero-visual-inner{text-align:center;color:var(--navy)}
.hero-visual-inner .year{font-family:var(--font-display);font-size:4.5rem;font-weight:700;color:var(--gold);line-height:1}
.hero-visual-inner .desc{font-size:0.85rem;color:var(--text-medium);margin-top:0.5rem;letter-spacing:0.1em;text-transform:uppercase}
/* ===== COMMON ===== */
.section{padding:5rem 2rem;scroll-margin-top:102px}
.section-inner{max-width:var(--max-width);margin:0 auto}
.section-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--gold);font-weight:600;margin-bottom:0.8rem}
.section-title{font-family:var(--font-display);font-size:2.6rem;font-weight:600;color:var(--navy);line-height:1.2;margin-bottom:1.5rem}
.section-text{font-size:1rem;color:var(--text-medium);max-width:720px;line-height:1.8}
.btn-primary{display:inline-flex;align-items:center;gap:0.6rem;background:var(--navy);color:var(--white);text-decoration:none;padding:0.85rem 1.8rem;border-radius:8px;font-weight:600;font-size:0.88rem;transition:var(--transition);margin-top:1.5rem;cursor:pointer}
.btn-primary:hover{background:var(--navy-light);transform:translateY(-2px);box-shadow:0 8px 25px rgba(11,29,58,0.2)}
.btn-gold{background:var(--gold);color:#FFFFFF}.btn-gold:hover{background:var(--gold-light);box-shadow:0 8px 25px rgba(162,9,52,0.3)}
/* ===== STATS ===== */
.stats-bar{background:var(--white);padding:2.5rem 2rem;border-bottom:1px solid rgba(0,0,0,0.05)}
.stats-container{max-width:var(--max-width);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2rem}
.stat-item{text-align:center}
.stat-number{font-family:var(--font-display);font-size:2.6rem;font-weight:700;color:var(--navy)}
.stat-number span{color:var(--gold)}
.stat-label{font-size:0.8rem;color:var(--text-light);margin-top:0.3rem;text-transform:uppercase;letter-spacing:0.08em}
/* ===== WHY CARDS ===== */
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:3rem}
.why-card{background:var(--white);border-radius:16px;padding:2.2rem;border:1px solid rgba(0,0,0,0.05);transition:var(--transition);position:relative;overflow:hidden}
.why-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.5s}
.why-card:hover::before{transform:scaleX(1)}
.why-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.08)}
.why-icon{width:52px;height:52px;background:rgba(162,9,52,0.08);border:1px solid rgba(162,9,52,0.18);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1.3rem}
.why-icon svg{width:24px;height:24px;color:var(--gold)}
.why-card h3{font-family:var(--font-display);font-size:1.3rem;font-weight:600;color:var(--navy);margin-bottom:0.7rem}
.why-card p{color:var(--text-medium);font-size:0.92rem;line-height:1.7}
/* ===== ABOUT QUOTES ===== */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:3rem}
.about-card{background:var(--white);border-radius:16px;padding:2.2rem;box-shadow:0 4px 20px rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.05)}
.about-quote{font-family:var(--font-display);font-size:1.1rem;font-style:italic;color:var(--text-dark);line-height:1.7;padding-left:1.5rem;border-left:3px solid var(--gold)}
.about-author{margin-top:1.3rem;font-weight:600;color:var(--navy)}
.about-author span{display:block;font-weight:400;color:var(--text-light);font-size:0.88rem}
/* ===== CONSULTING ===== */
#consultoria{background:var(--navy);color:var(--white);position:relative;overflow:hidden}
#consultoria::before{content:'';position:absolute;top:-50%;right:-20%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(162,9,52,0.06) 0%,transparent 70%)}
#consultoria .section-title{color:var(--white)}
#consultoria .section-text{color:rgba(255,255,255,0.7)}
.consulting-content{display:grid;grid-template-columns:1.2fr 1fr;gap:4rem;align-items:center;position:relative;z-index:1}
.consulting-steps{display:flex;flex-direction:column;gap:1.2rem;margin-top:1.8rem}
.consulting-step{display:flex;gap:1rem;align-items:flex-start}
.step-num{min-width:38px;height:38px;background:rgba(162,9,52,0.15);border:1px solid rgba(162,9,52,0.3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--gold)}
.step-text h4{font-size:0.95rem;font-weight:600;margin-bottom:0.15rem}
.step-text p{font-size:0.85rem;color:rgba(255,255,255,0.6)}
.consulting-visual{display:flex;justify-content:center;align-items:center}
.methodology-circle{width:300px;height:300px;border-radius:50%;border:2px solid rgba(162,9,52,0.2);display:flex;align-items:center;justify-content:center;position:relative}
.methodology-circle::before{content:'';position:absolute;inset:15px;border-radius:50%;border:1px dashed rgba(162,9,52,0.15)}
.methodology-center{text-align:center}
.methodology-center .tm-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--gold)}
.methodology-center .tm-name{font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--white);line-height:1.2}
.methodology-center .tm-sub{font-size:0.82rem;color:rgba(255,255,255,0.5);margin-top:0.3rem}
/* ===== LEARNING ===== */
#aprendizado{background:var(--cream)}
.learning-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;margin-top:2.5rem}
.learning-card{background:var(--white);border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,0.05);transition:var(--transition)}
.learning-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.08)}
.learning-card-header{background:linear-gradient(135deg,var(--gold),#8A0729);padding:1.6rem;position:relative;overflow:hidden}
.learning-card-header::after{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;border-radius:50%;background:rgba(162,9,52,0.08)}
.learning-card-header h3{font-family:var(--font-display);font-size:1.2rem;font-weight:600;color:var(--white);position:relative;z-index:1}
.learning-card-header .tag{display:inline-block;background:rgba(255,255,255,0.92);color:var(--gold);font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;padding:0.25rem 0.7rem;border-radius:20px;margin-bottom:0.6rem;position:relative;z-index:1}
.learning-card-body{padding:1.6rem}
.learning-card-body p{color:var(--text-medium);font-size:0.9rem;line-height:1.7}
.learning-meta{display:flex;gap:1.3rem;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid rgba(0,0,0,0.06)}
.meta-item{display:flex;align-items:center;gap:0.4rem;font-size:0.78rem;color:var(--text-light)}
.meta-item svg{width:15px;height:15px;color:var(--gold)}
/* ===== TALENT ===== */
#talentos{background:var(--white)}
.talent-content{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.talent-list{display:flex;flex-direction:column;gap:1rem;margin-top:1.8rem}
.talent-item{display:flex;gap:1rem;align-items:flex-start;padding:1.1rem;background:var(--cream);border-radius:12px;transition:var(--transition)}
.talent-item:hover{background:var(--cream-dark)}
.talent-item-icon{min-width:38px;height:38px;background:rgba(162,9,52,0.08);border:1px solid rgba(162,9,52,0.18);border-radius:10px;display:flex;align-items:center;justify-content:center}
.talent-item-icon svg{width:18px;height:18px;color:var(--gold)}
.talent-item h4{font-size:0.95rem;font-weight:600;color:var(--navy);margin-bottom:0.15rem}
.talent-item p{font-size:0.85rem;color:var(--text-medium)}
/* ===== MAP SECTION ===== */
#mapa{background:linear-gradient(180deg,#FFFFFF 0%,var(--cream) 100%);color:var(--text-dark);position:relative;overflow:hidden}
#mapa::before{content:'';position:absolute;top:10%;right:-5%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(162,9,52,0.04) 0%,transparent 70%)}
#mapa .section-title{color:var(--navy)}
#mapa .section-text{color:var(--text-medium)}
.map-layout{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-top:2.5rem;position:relative;z-index:1;align-items:start}
/* SVG Map */
.map-container{position:relative}
.map-container svg{width:100%;height:auto;max-height:600px}
.map-container svg .country-path{fill:rgba(162,9,52,0.10);stroke:rgba(162,9,52,0.45);stroke-width:0.8;transition:fill 0.3s, stroke 0.3s;cursor:pointer;}
.map-container svg .country-path:hover{fill:rgba(162,9,52,0.3);stroke:var(--gold)}
.map-container svg .country-path.selected{fill:var(--gold);stroke:var(--gold-light);stroke-width:1.8;filter:drop-shadow(0 0 8px rgba(162,9,52,0.5))}
.map-container svg .country-path.available{fill:rgba(162,9,52,0.2)}
.country-label.small{font-size:6.5px}
.country-label{font-size:10px;fill:rgba(43,61,79,0.65);text-anchor:middle;pointer-events:none;font-family:var(--font-body);font-weight:500}
.country-label.selected-label{fill:#FFFFFF;font-weight:700}
/* Country Panel */
.country-panel{
background:#FFFFFF;border:1px solid rgba(43,61,79,0.1);box-shadow:0 4px 24px rgba(43,61,79,0.08);
border-radius:16px;padding:2.5rem;min-height:400px;
transition:var(--transition);
}
.country-panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;min-height:400px}
.country-panel-empty svg{width:60px;height:60px;color:rgba(162,9,52,0.3);margin-bottom:1rem}
.country-panel-empty h3{font-family:var(--font-display);font-size:1.4rem;color:var(--text-medium);margin-bottom:0.5rem}
.country-panel-empty p{font-size:0.88rem;color:var(--text-light)}
.panel-content{display:none}
.panel-content.active{display:block}
.panel-country-name{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--gold);margin-bottom:0.3rem}
.panel-country-region{font-size:0.8rem;color:var(--text-medium);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1.5rem}
.panel-section{margin-bottom:2rem}
.panel-section-title{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);font-weight:600;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem}
.panel-section-title svg{width:14px;height:14px}
.panel-contact-item{display:flex;gap:0.8rem;align-items:center;margin-bottom:0.8rem}
.panel-contact-item .icon-wrap{width:32px;height:32px;background:rgba(162,9,52,0.1);border:1px solid rgba(162,9,52,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center}
.panel-contact-item .icon-wrap svg{width:14px;height:14px;color:var(--gold)}
.panel-contact-item span{font-size:0.88rem;color:var(--text-medium)}
.panel-contact-item a{color:var(--gold);text-decoration:none}
.panel-contact-item a:hover{text-decoration:underline}
.panel-course{background:rgba(162,9,52,0.03);border:1px solid rgba(162,9,52,0.04);border-radius:10px;padding:1rem 1.2rem;margin-bottom:0.8rem;transition:var(--transition)}
.panel-course:hover{background:rgba(255,255,255,0.07)}
.panel-course-name{font-weight:600;font-size:0.9rem;color:var(--navy);margin-bottom:0.2rem}
.panel-course-date{font-size:0.78rem;color:var(--text-light)}
.panel-course-tag{display:inline-block;background:rgba(162,9,52,0.15);color:var(--gold-light);font-size:0.62rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;padding:2px 8px;border-radius:3px;margin-left:0.5rem}
.panel-btn{display:inline-flex;align-items:center;gap:0.5rem;background:var(--gold);color:#FFFFFF;border:none;padding:0.7rem 1.5rem;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:var(--transition);margin-top:0.5rem;font-family:var(--font-body)}
.panel-btn:hover{background:var(--gold-light);transform:translateY(-1px)}
/* ===== INSIGHTS ===== */
#insights{background:var(--cream)}
.insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8rem;margin-top:2.5rem}
.insight-card{background:var(--white);border-radius:16px;overflow:hidden;border:1px solid rgba(0,0,0,0.05);transition:var(--transition)}
.insight-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.08)}
.insight-card-color{height:5px;background:linear-gradient(90deg,var(--gold),var(--accent-teal))}
.insight-card-body{padding:1.8rem}
.insight-card-body .cat{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);font-weight:600;margin-bottom:0.7rem}
.insight-card-body h3{font-family:var(--font-display);font-size:1.2rem;font-weight:600;color:var(--navy);line-height:1.3;margin-bottom:0.7rem}
.insight-card-body p{font-size:0.88rem;color:var(--text-medium);line-height:1.7}
/* ===== CONTACT ===== */
#contato{background:linear-gradient(180deg,var(--cream) 0%,#EDE6E1 100%);color:var(--text-dark);position:relative;overflow:hidden}
#contato::before{content:'';position:absolute;bottom:-30%;left:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(162,9,52,0.05) 0%,transparent 70%)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;position:relative;z-index:1}
.contact-info{display:flex;flex-direction:column;gap:1.8rem;margin-top:1.8rem}
.contact-item{display:flex;gap:1rem;align-items:flex-start}
.contact-item-icon{min-width:42px;height:42px;background:rgba(162,9,52,0.1);border:1px solid rgba(162,9,52,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center}
.contact-item-icon svg{width:18px;height:18px;color:var(--gold)}
.contact-item h4{font-size:0.9rem;font-weight:600;margin-bottom:0.15rem}
.contact-item p{font-size:0.88rem;color:rgba(255,255,255,0.6)}
.contact-item a{color:var(--gold);text-decoration:none}
.contact-item a:hover{text-decoration:underline}
.contact-form{background:#FFFFFF;border:1px solid rgba(43,61,79,0.1);box-shadow:0 4px 24px rgba(43,61,79,0.08);border-radius:16px;padding:2.5rem}
.contact-form h3{font-family:var(--font-display);font-size:1.4rem;margin-bottom:1.3rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:0.8rem;font-weight:500;margin-bottom:0.35rem;color:var(--text-medium)}
.form-group input,.form-group textarea,.form-group select{width:100%;background:#FBFAF9;border:1px solid rgba(43,61,79,0.15);color:var(--text-dark);padding:0.75rem 1rem;border-radius:8px;font-size:0.9rem;font-family:var(--font-body);transition:border-color 0.3s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--gold);background:#FFFFFF}
.form-group select option{background:#FFFFFF;color:var(--text-dark)}
.form-group textarea{resize:vertical;min-height:90px}
.form-submit{background:var(--gold);color:#FFFFFF;border:none;padding:0.85rem 2rem;border-radius:8px;font-weight:600;font-size:0.92rem;cursor:pointer;transition:var(--transition);width:100%}
.form-submit:hover{background:var(--gold-light);box-shadow:0 6px 20px rgba(162,9,52,0.3)}
/* ===== NEWSLETTER ===== */
.newsletter{background:linear-gradient(135deg,var(--cream-dark),var(--cream));padding:3.5rem 2rem;text-align:center}
.newsletter-inner{max-width:550px;margin:0 auto}
.newsletter h2{font-family:var(--font-display);font-size:1.8rem;color:var(--navy);margin-bottom:0.7rem}
.newsletter p{color:var(--text-medium);margin-bottom:1.3rem;font-size:0.95rem}
.newsletter-form{display:flex;gap:0.7rem}
.newsletter-form input{flex:1;background:#FFFFFF;border:1px solid rgba(43,61,79,0.15);color:var(--text-dark);padding:0.75rem 1.1rem;border-radius:8px;font-size:0.88rem;font-family:var(--font-body)}
.newsletter-form input:focus{outline:none;border-color:var(--gold)}
.newsletter-form button{background:var(--gold);color:#FFFFFF;border:none;padding:0.75rem 1.6rem;border-radius:8px;font-weight:600;font-size:0.88rem;cursor:pointer;transition:var(--transition);font-family:var(--font-body)}
.newsletter-form button:hover{background:var(--navy-light)}
/* ===== FOOTER ===== */
.footer{background:#1E2B38;padding:2.5rem 2rem 1.8rem;border-top:1px solid rgba(162,9,52,0.1)}
.footer-inner{max-width:var(--max-width);margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.footer-left{color:rgba(255,255,255,0.4);font-size:0.82rem}
.footer-left a{color:rgba(255,255,255,0.6);text-decoration:none;transition:var(--transition)}
.footer-left a:hover{color:var(--gold)}
.footer-links{display:flex;gap:1.3rem}
.footer-links a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.82rem;transition:var(--transition);cursor:pointer}
.footer-links a:hover{color:var(--gold)}
.fade-up{opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}
.fade-up.visible{opacity:1;transform:translateY(0)}
@media(max-width:1024px){
.hero-content{grid-template-columns:1fr;text-align:center}
.hero-right{display:none}
.hero-left h1{font-size:2.8rem}
.about-grid,.consulting-content,.talent-content,.contact-grid,.map-layout{grid-template-columns:1fr}
.why-grid{grid-template-columns:1fr 1fr}
.consulting-visual{order:-1}
}
@media(max-width:768px){
.hero-left h1{font-size:2.2rem}
.section-title{font-size:2rem}
.stats-container{grid-template-columns:repeat(2,1fr)}
.why-grid,.learning-grid,.insights-grid{grid-template-columns:1fr}
.newsletter-form{flex-direction:column}
.footer-inner{flex-direction:column;gap:1rem;text-align:center}
.section{padding:3.5rem 1.5rem}
.lang-bar{padding:0 1rem;justify-content:center}
}
/* WhatsApp Float */
.wpp-float{position:fixed;bottom:24px;right:24px;z-index:9999;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(37,211,102,0.4);transition:all 0.3s;text-decoration:none}
.wpp-float:hover{transform:scale(1.1);box-shadow:0 6px 25px rgba(37,211,102,0.5)}
.wpp-float svg{width:32px;height:32px;fill:#fff}
.wpp-float .wpp-tip{position:absolute;right:72px;background:#fff;color:#333;padding:8px 14px;border-radius:8px;font-size:0.82rem;font-weight:500;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,0.15);opacity:0;transform:translateX(10px);transition:all 0.3s;pointer-events:none}
.wpp-float:hover .wpp-tip{opacity:1;transform:translateX(0)}
@media(max-width:768px){.wpp-float{bottom:16px;right:16px;width:54px;height:54px}.wpp-float svg{width:28px;height:28px}}
/* Partner Block */
.partner-block{margin-top:2.5rem;padding:2rem;background:#FFFFFF;border:1px solid rgba(43,61,79,0.1);box-shadow:0 4px 24px rgba(43,61,79,0.06);border-radius:16px}
.partner-block-header{display:flex;align-items:center;gap:0.6rem;margin-bottom:1.2rem}
.partner-block-header .plabel{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);font-weight:600}
.partner-logo-row{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.partner-logo-row img{height:48px;width:auto;opacity:0.92;transition:opacity 0.3s}
.partner-logo-row img:hover{opacity:1}
.partner-info .pname{font-family:var(--font-display);font-size:1.15rem;font-weight:600;color:var(--navy)}
.partner-info .prole{font-size:0.78rem;color:var(--text-light)}
.partner-contact-row{display:flex;gap:2rem;margin-top:1rem;flex-wrap:wrap}
.pci{display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;color:var(--text-medium)}
.pci svg{width:15px;height:15px;color:var(--gold);flex-shrink:0}
.pci a{color:var(--gold);text-decoration:none}
.map-container svg .country-path:focus{outline:none;fill:rgba(162,9,52,0.35);stroke:var(--gold);stroke-width:1.5}
.map-hint{text-align:center;font-size:0.85rem;color:var(--text-light);margin-bottom:1rem;font-style:italic}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
/* ===== A11Y / UTILITY ===== */
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}

coursesHtml='<div style="background:rgba(162,9,52,0.06);border:1px solid rgba(162,9,52,0.15);border-radius:12px;padding:1.2rem;text-align:center">';
coursesHtml+='<p style="color:var(--text-medium);font-size:0.85rem;margin-bottom:0.6rem">'+i18n[currentLang].panel_no_courses+'</p>';
coursesHtml+='<p style="color:var(--gold);font-size:0.8rem;font-weight:600;margin-bottom:0.8rem">'+i18n[currentLang].notify_txt+'</p>';
coursesHtml+='<div style="display:flex;gap:0.5rem"><input type="email" id="notifyEmail" placeholder="'+i18n[currentLang].notify_ph+'" style="flex:1;background:#FBFAF9;border:1px solid rgba(43,61,79,0.18);color:var(--text-dark);padding:0.55rem 0.8rem;border-radius:8px;font-size:0.82rem;font-family:var(--font-body)"/>';
coursesHtml+='<button onclick="submitNotify()" style="background:var(--gold);color:#FFFFFF;border:none;padding:0.55rem 1rem;border-radius:8px;font-weight:600;font-size:0.78rem;cursor:pointer;white-space:nowrap;font-family:var(--font-body)">'+i18n[currentLang].notify_btn+'</button></div></div>';
} else {
data.courses.forEach(function(c){
var tagText = typeof c.tag === 'object' ? c.tag[currentLang] : c.tag;
coursesHtml += '<div class="panel-course"><div class="panel-course-name">'+c.name+'<span class="panel-course-tag">'+tagText+'</span></div><div class="panel-course-date">'+c.date+'</div></div>';
});
}
document.getElementById('panelCourses').innerHTML = coursesHtml;
// Also set form country
var formSelect = document.getElementById('formCountry');
if(formSelect) formSelect.value = code;
}
// ======== RENDER FUNCTIONS ========
function renderConsultingSteps(){
var steps = i18n[currentLang].consulting_steps;
var html = '';
steps.forEach(function(s,i){
html += '<div class="consulting-step"><div class="step-num">'+(i+1)+'</div><div class="step-text"><h4>'+s.t+'</h4><p>'+s.d+'</p></div></div>';
});
document.getElementById('consultingSteps').innerHTML = html;
}
function renderLearningCards(){
var cards = i18n[currentLang].learning_cards;
var icons = [
['<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>','<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'],
['<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>','<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'],
['<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>','<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'],
['<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>','<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>']
];
var html = '';
cards.forEach(function(c,i){
var ic = icons[i] || icons[0];
html += '<div class="learning-card fade-up"><div class="learning-card-header"><div class="tag">'+c.tag+'</div><h3>'+c.title+'</h3></div><div class="learning-card-body"><p>'+c.text+'</p><div class="learning-meta"><div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ic[0]+'</svg> '+c.m1+'</div><div class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+ic[1]+'</svg> '+c.m2+'</div></div></div></div>';
});
document.getElementById('learningGrid').innerHTML = html;
// Re-observe fade ups
document.querySelectorAll('#learningGrid .fade-up').forEach(function(el){obs.observe(el)});
}
function renderInsights(){
var cards = i18n[currentLang].insight_cards;
var html = '';
cards.forEach(function(c){
html += '<div class="insight-card fade-up"><div class="insight-card-color"></div><div class="insight-card-body"><div class="cat">'+c.cat+'</div><h3>'+c.title+'</h3><p>'+c.text+'</p></div></div>';
});
document.getElementById('insightsGrid').innerHTML = html;
document.querySelectorAll('#insightsGrid .fade-up').forEach(function(el){obs.observe(el)});
}
// ======== LANGUAGE SWITCH ========
function setLang(lang){
currentLang = lang;
document.getElementById('langPt').classList.toggle('active', lang==='pt');
document.getElementById('langEs').classList.toggle('active', lang==='es');
document.documentElement.lang = lang==='pt'?'pt-BR':'es';
try{
var url = new URL(window.location.href);
url.searchParams.set('lang', lang);
window.history.replaceState({}, '', url);
}catch(err){}
applyI18n();
renderConsultingSteps();
renderLearningCards();
renderInsights();
if(selectedCountry) selectCountry(selectedCountry);
}
function applyI18n(){
var t = i18n[currentLang];
document.querySelectorAll('[data-i18n]').forEach(function(el){
var key = el.getAttribute('data-i18n');
if(t[key]) el.textContent = t[key];
});
document.querySelectorAll('[data-i18n-html]').forEach(function(el){
var key = el.getAttribute('data-i18n-html');
if(t[key]) el.innerHTML = t[key];
});
document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){
var key = el.getAttribute('data-i18n-placeholder');
if(t[key]) el.placeholder = t[key];
});
}
// ======== NAVIGATION ========
function goTo(id){
closeMobile();
var el = document.getElementById(id);
if(!el) return;
var y = el.getBoundingClientRect().top + window.pageYOffset - 102;
window.scrollTo({top:y,behavior:'smooth'});
}
function toggleMobile(){
var m=document.getElementById('mobileMenu'),o=document.getElementById('mobileOverlay'),b=document.getElementById('hamburger');
if(m.classList.contains('open')){closeMobile()}else{m.classList.add('open');o.classList.add('show');b.classList.add('open');document.body.style.overflow='hidden'}
}
function closeMobile(){
var m=document.getElementById('mobileMenu'),o=document.getElementById('mobileOverlay'),b=document.getElementById('hamburger');
m.classList.remove('open');o.classList.remove('show');b.classList.remove('open');document.body.style.overflow='';
}
window.addEventListener('scroll',function(){
document.getElementById('header').classList.toggle('scrolled',window.scrollY>50);
var ids=['inicio','sobre','consultoria','aprendizado','mapa','insights','contato'],cur='inicio';
for(var i=0;i<ids.length;i++){var s=document.getElementById(ids[i]);if(s&&s.getBoundingClientRect().top<=110)cur=ids[i]}
document.querySelectorAll('[data-section]').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-section')===cur)});
});
// ======== FADE OBSERVER ========
var obs = new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
function submitForm(e){
e.preventDefault();
var f=e.target;
if(document.getElementById('formWebsite').value){return;}
var btn=f.querySelector('.form-submit'),orig=btn.textContent;
btn.textContent='Enviando...';btn.disabled=true;
var d={name:document.getElementById('formName').value,email:document.getElementById('formEmail').value,company:document.getElementById('formCompany').value,country:document.getElementById('formCountry').value,message:document.getElementById('formMessage').value,source:'lamarsh-latam-website',lang:currentLang};
fetch('https://collabz.app.n8n.cloud/webhook/lamarsh-contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw new Error('x');alert(i18n[currentLang].form_success);f.reset();}).catch(function(){var s=encodeURIComponent('Contato LaMarsh LATAM - '+d.name),b=encodeURIComponent('Nome: '+d.name+'\nEmail: '+d.email+'\nEmpresa: '+d.company+'\nPais: '+d.country+'\nMsg: '+d.message);window.location.href='mailto:LaMarshLA@collabz.com.br?subject='+s+'&body='+b;}).finally(function(){btn.textContent=orig;btn.disabled=false;});
}
function submitNewsletter(e){
e.preventDefault();
var f=e.target;
if(document.getElementById('newsletterWebsite').value){return;}
var emailInput=document.getElementById('newsletterEmail'),email=emailInput.value;
var btn=f.querySelector('button[type="submit"]'),orig=btn.textContent;
btn.disabled=true;
fetch('https://collabz.app.n8n.cloud/webhook/lamarsh-newsletter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,source:'lamarsh-latam-website-newsletter',lang:currentLang})}).then(function(r){if(!r.ok)throw new Error('x');alert(i18n[currentLang].newsletter_thanks);f.reset();}).catch(function(){window.location.href='mailto:LaMarshLA@collabz.com.br?subject='+encodeURIComponent('Inscrição Newsletter')+'&body='+encodeURIComponent('E-mail: '+email);}).finally(function(){btn.disabled=false;btn.textContent=orig;});
}
function submitNotify(){
var email=document.getElementById('notifyEmail').value,cc=window._notifyCC||'';
if(!email||email.indexOf('@')<0){alert(currentLang==='pt'?'Insira um e-mail válido.':'Ingrese un e-mail válido.');return;}
fetch('https://collabz.app.n8n.cloud/webhook/lamarsh-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,country:cc,name:countries[cc]?countries[cc].name:cc,type:'notify',lang:currentLang})}).then(function(){alert(i18n[currentLang].notify_ok);document.getElementById('notifyEmail').value='';}).catch(function(){window.location.href='mailto:LaMarshLA@collabz.com.br?subject='+encodeURIComponent('Interesse cursos - '+(countries[cc]?countries[cc].name:cc))+'&body='+encodeURIComponent('Email: '+email);});
}
// ======== INIT ========
(function(){
var urlLang = new URLSearchParams(window.location.search).get('lang');
if(urlLang==='es'||urlLang==='pt') currentLang = urlLang;
})();
document.getElementById('langPt').classList.toggle('active', currentLang==='pt');
document.getElementById('langEs').classList.toggle('active', currentLang==='es');
document.documentElement.lang = currentLang==='pt'?'pt-BR':'es';
var footerYearEl = document.getElementById('footerYear');
if(footerYearEl) footerYearEl.textContent = new Date().getFullYear();
fetch('data/countries.json').then(function(r){
if(!r.ok) throw new Error('countries.json ' + r.status);
return r.json();
}).then(function(data){
countries = data;
}).catch(function(err){
console.error('Falha ao carregar dados de países:', err);
}).finally(function(){
buildMap();
applyI18n();
renderConsultingSteps();
renderLearningCards();
renderInsights();
document.querySelectorAll('.fade-up').forEach(function(el){obs.observe(el)});
});
</script>
